name: "gha-dkim"
description: " Github Action for continuous deployment with dkim authentication"
inputs:
  server:
    description: "The target server"
    required: true
  file_to_deploy:
    description: "The artefact to deploy (single file, deprecated - use files_to_deploy instead)"
    required: false
  files_to_deploy:
    description: "The artefacts to deploy (space-separated list of files)"
    required: false
  signing_address:
    description: "The signing address eg foo@example.com (requires foo._domain.example.com to contain the dkim public key)"
    required: true
  pem_private_key_path:
    description: "Path to the PEM private key file for DKIM signing"
    required: false
    default: "/tmp/a.pem"

runs:
  using: "composite"
  steps:
    - name: requirements
      shell: "bash"
      run: |
        pip install --upgrade dkimpy

    - name: deploy
      id: deploy
      shell: "bash"
      run: |
        if [ -n "${{ inputs.files_to_deploy }}" ]; then
          python ${{ github.action_path }}/deploy.py \
            --server ${{ inputs.server }} \
            --files_to_deploy ${{ inputs.files_to_deploy }} \
            --signing_address ${{ inputs.signing_address }} \
            --pem_private_key_path ${{ inputs.pem_private_key_path }}
        elif [ -n "${{ inputs.file_to_deploy }}" ]; then
          python ${{ github.action_path }}/deploy.py \
            --server ${{ inputs.server }} \
            --file_to_deploy ${{ inputs.file_to_deploy }} \
            --signing_address ${{ inputs.signing_address }} \
            --pem_private_key_path ${{ inputs.pem_private_key_path }}
        else
          echo "Error: Either file_to_deploy or files_to_deploy must be specified"
          exit 1
        fi
